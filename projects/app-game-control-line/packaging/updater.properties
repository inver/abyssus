# What an update cannot replace: jars that carry native code, matched by file name (`*` globs, comma separated).
# They are part of the installer; a release that changes one needs a new installer (see lib-updater's README).
installerOnly=*natives*,jolt-jni-*
# Bumped when the launcher and the game stop understanding each other; part of installer.digest.
launcherProtocol=1
