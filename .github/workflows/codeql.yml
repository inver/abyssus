# CodeQL analysis for the Kotlin/Java code (java-kotlin extractor).
#
# This replaces GitHub's "default setup", which auto-detected Python from `models/` (CAD scripts).
# Default setup must be switched off: Settings > Code security > Code scanning > CodeQL analysis > Switch to advanced.
#
# CodeQL has no GLSL/shader extractor, so shaders (*.glsl, *.vert, *.frag, *.comp) are not analyzed by it;
# the build workflow compiles the Vulkan compute shaders with glslang.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          config: |
            paths-ignore:
              - models
              - .agents
              - .kilo
              - '**/build'
              - '**/src/main/gen'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
