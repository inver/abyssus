name: Release Control Line

# Runs only for a tag `control-line-vX.Y.Z` and publishes an immutable release `control-line-vX.Y.Z` with:
# - the installers that carry the game's launcher and its own Java runtime: .deb, .rpm and .AppImage (Linux x64),
#   .msi (Windows x64), .dmg (macOS arm64 and Intel). jpackage cannot cross-build, so each is built on a runner of its OS;
# - the update parts `game-code-X.Y.Z.zip` and `game-project-X.Y.Z.zip` and `manifest.json`, which an installed launcher
#   downloads instead of a new installer;
# - `SHA256SUMS` over the installers.
#
# There is no key of ours: GitHub signs an immutable release itself (a release attestation listing the tag, the commit and
# the SHA-256 of every asset), and the game accepts a manifest only when that attestation lists it. The release is made last,
# after every platform and every check passed, so a failure leaves the previous release the latest.
#
# Maintainer setup (repository settings, not code): enable "Immutable releases"; the `release` environment with required
# reviewers; a tag protection rule for control-line-v*. The macOS .dmg files are signed with a Developer ID Application
# certificate and notarized by Apple; the secrets MAC_CERT_P12 (base64 .p12), MAC_CERT_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID live in the `release` environment, which the macOS build jobs use. Other
# installers are not code-signed yet (Authenticode).
on:
  push:
    tags: ['control-line-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The .msi needs a numeric version, the .dmg a major version above 0 (jpackage rejects 0.y.z on macOS), and the
      # launcher orders releases by it: only control-line-vX.Y.Z with X >= 1 is accepted
      - name: Check tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^control-line-v([1-9][0-9]*\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not control-line-vX.Y.Z with a major version X of 1 or more (macOS packages reject 0.y.z)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    # the macOS jobs read the signing secrets of the `release` environment; other platforms leave it empty
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (deb, rpm, AppImage)
            os: ubuntu-22.04 # the older glibc is the floor of the AppImage
            artifact: linux-x64
            tasks: ":app-game-control-line:packageDeb :app-game-control-line:packageRpm :app-game-control-line:packageAppImage :app-game-control-line:buildUpdateParts"
            paths: |
              projects/app-game-control-line/build/packaging/deb/*.deb
              projects/app-game-control-line/build/packaging/rpm/*.rpm
              projects/app-game-control-line/build/packaging/appimage/*.AppImage
          - name: Windows x64 (msi)
            os: windows-latest
            artifact: windows-x64
            tasks: ":app-game-control-line:packageMsi"
            paths: projects/app-game-control-line/build/packaging/msi/*.msi
          - name: macOS arm64 (dmg)
            os: macos-latest # Apple silicon
            artifact: macos-arm64
            environment: release
            tasks: ":app-game-control-line:packageDmg"
            paths: projects/app-game-control-line/build/packaging/dmg/*.dmg
          - name: macOS Intel x64 (dmg)
            os: macos-15-intel # an Intel runner; check the label against GitHub's list if the job never starts
            artifact: macos-x64
            environment: release
            tasks: ":app-game-control-line:packageDmg"
            paths: projects/app-game-control-line/build/packaging/dmg/*.dmg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm desktop-file-utils xvfb libgl1-mesa-dri libgl1 libasound2

      # jpackage 21 builds an .msi with WiX 3.x; the runner image may already ship a 3.14.1 build
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if command -v candle.exe >/dev/null 2>&1 || ls -d "/c/Program Files (x86)"/WiX*3*/bin/candle.exe >/dev/null 2>&1; then
            echo "WiX 3.x already installed"
            for d in "/c/Program Files (x86)"/WiX*3*/bin; do
              [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
            done
          else
            choco install wixtoolset --version=3.14.1 --no-progress -y
          fi

      # The Developer ID certificate lives only in a temporary keychain of this job. The packaging build signs with the
      # identity in ABYSSUS_MAC_SIGN_IDENTITY (the app, its native libraries, the jars' native libraries and the .dmg).
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "::error::Secrets MAC_CERT_P12 and MAC_CERT_PASSWORD are not set (Developer ID Application certificate, base64 .p12, and its password)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in the certificate (a missing private key or another certificate type?)"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "ABYSSUS_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build installers
        shell: bash
        # every OS's seed holds the same jars (Jolt natives of all platforms), so one manifest fits all installers
        run: ./gradlew ${{ matrix.tasks }} -PcontrolLineVersion=${{ needs.version.outputs.version }} -Pabyssus.universalDist=true --no-daemon

      # Apple scans the .dmg and everything in it; the ticket is stapled so the app opens offline too
      - name: Notarize macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Secrets APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are not set"
            exit 1
          fi
          dmgs=(projects/app-game-control-line/build/packaging/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected one .dmg, found: ${dmgs[*]}"; exit 1; }
          dmg="${dmgs[0]}"
          result="$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 40m --output-format json)"
          echo "$result"
          status="$(jq -r '.status' <<< "$result")"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r '.id' <<< "$result")" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Notarization of $dmg ended with status $status"
            exit 1
          fi
          # stapler talks to Apple's CloudKit, which drops connections now and then (NSURLErrorDomain -1005): retry
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt of 5), retrying"
              sleep $((attempt * 15))
            done
            return 1
          }
          retry xcrun stapler staple "$dmg"
          retry xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Smoke test Linux packages
        if: runner.os == 'Linux'
        run: scripts/smoke-control-line-linux.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: control-line-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

      # The Linux job builds the update parts and the unsigned manifest; every job reports its installer.digest
      - name: Upload update parts
        if: matrix.artifact == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: control-line-update
          path: projects/app-game-control-line/build/packaging/update/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.artifact }}
          path: projects/app-game-control-line/build/packaging/installer.digest
          if-no-files-found: error
          retention-days: 7

  # Only when every platform built: a failed platform publishes nothing
  publish:
    name: Check and publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Every platform's installer.digest must equal the one in the manifest: a runner on another JDK patch would otherwise
      # tell that OS's players "a new installer is needed" forever
      - name: Check the installer digests agree
        run: |
          mapfile -t digests < <(find dist -name installer.digest | sort)
          [ "${#digests[@]}" -eq 4 ] || { echo "::error::expected 4 installer.digest files, found ${#digests[@]}"; exit 1; }
          [ "$(cat "${digests[@]}" | sort -u | wc -l)" -eq 1 ] || { echo "::error::the platforms disagree on installer.digest"; head -v "${digests[@]}"; exit 1; }

      - name: Gather the release folder
        run: |
          mkdir release
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.dmg' \
            -o -name 'game-code-*.zip' -o -name 'game-project-*.zip' -o -name manifest.json \) -exec cp {} release/ \;
          ls -l release

      # SHA256SUMS over the installers (GitHub's release attestation covers it like every other asset)
      - name: Write SHA256SUMS and check the folder
        run: |
          ./gradlew :app-game-control-line:writeChecksums -PreleaseDir="$PWD/release" --no-daemon
          ./gradlew :lib-updater:verifyReleaseManifest -PreleaseDir="$PWD/release" -PrequireChecksums=true --no-daemon

      # GitHub signs only an immutable release. Refuse to publish when the setting is off (best effort: a token that may not
      # read the setting continues, and the check after publishing is the ground truth)
      - name: Check immutable releases are enabled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if state="$(gh api "repos/$GH_REPO/immutable-releases" --jq .enabled 2>/dev/null)"; then
            [ "$state" = "true" ] || { echo "::error::Immutable releases are not enabled for $GH_REPO: GitHub would not sign the release. Nothing is published."; exit 1; }
          else
            echo "::warning::Could not read the immutable-releases setting; the attestation check after publishing decides"
          fi

      # A draft first, then published: an immutable release is locked when it is published, so every asset must be there by then
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --draft --verify-tag \
            --title "Control Line ${TAG#control-line-v}" \
            --notes "Control Line ${TAG#control-line-v}: .deb, .rpm and .AppImage (Linux x64), .msi (Windows x64), .dmg (macOS arm64 and Intel). This is an immutable release signed by GitHub: check a download with \`gh release verify-asset $TAG <file>\` (see the game's README). Installed games update themselves from manifest.json. The macOS .dmg files are signed and notarized; the other installers are not code-signed, so Windows SmartScreen warns on first start."
          gh release edit "$TAG" --draft=false

      # GitHub issues the attestation a moment after publishing; the game accepts the release only once it exists and lists the
      # manifest, so wait for it and compare it with the files that were uploaded
      - name: Verify GitHub's release attestation
        run: ./gradlew :lib-updater:verifyPublishedRelease -Prepository="$GITHUB_REPOSITORY" -Ptag="$GITHUB_REF_NAME" -PreleaseDir="$PWD/release" --no-daemon
