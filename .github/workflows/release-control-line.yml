name: Release Control Line

# Runs only for a tag `cl-vX.Y.Z` and publishes the release `cl-vX.Y.Z` with:
# - the installers that carry the game's launcher and its own Java runtime: .deb, .rpm and .AppImage (Linux x64),
#   .msi (Windows x64), .dmg (macOS arm64 and Intel). jpackage cannot cross-build, so each is built on a runner of its OS;
# - the update package `control-line-X.Y.Z-update.zip`: the game's jars (natives of every desktop platform) and its
#   project, which an installed launcher downloads instead of a new installer;
# - `SHA256SUMS` over every asset and `SHA256SUMS.sig`, its Ed25519 signature made with the private update key, plus
#   `update-key.pub.pem`, the public half, so anyone can check the files with
#   `openssl pkeyutl -verify -pubin -inkey update-key.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig`.
#
# The private key is the secret UPDATE_SIGNING_KEY (PEM, `openssl genpkey -algorithm ED25519`), read only by the publish
# job in the `release` environment. The macOS .dmg files are signed with a Developer ID Application certificate and notarized by Apple; the secrets
# MAC_CERT_P12 (base64 .p12), MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID live in the
# `release` environment, which the macOS build jobs use. Other installers are not code-signed yet (Authenticode).
on:
  push:
    tags: ['cl-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The .msi needs a numeric version, the .dmg a major version above 0 (jpackage rejects 0.y.z on macOS), and the
      # launcher orders releases by it: only cl-vX.Y.Z with X >= 1 is accepted
      - name: Check tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^cl-v([1-9][0-9]*\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not cl-vX.Y.Z with a major version X of 1 or more (macOS packages reject 0.y.z)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    # the macOS jobs read the signing secrets of the `release` environment; other platforms leave it empty
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (deb, rpm, AppImage)
            os: ubuntu-22.04 # the older glibc is the floor of the AppImage
            artifact: linux-x64
            tasks: ":app-game-control-line:packageDeb :app-game-control-line:packageRpm :app-game-control-line:packageAppImage"
            paths: |
              projects/app-game-control-line/build/packaging/deb/*.deb
              projects/app-game-control-line/build/packaging/rpm/*.rpm
              projects/app-game-control-line/build/packaging/appimage/*.AppImage
          - name: Windows x64 (msi)
            os: windows-latest
            artifact: windows-x64
            tasks: ":app-game-control-line:packageMsi"
            paths: projects/app-game-control-line/build/packaging/msi/*.msi
          - name: macOS arm64 (dmg)
            os: macos-latest # Apple silicon
            artifact: macos-arm64
            environment: release
            tasks: ":app-game-control-line:packageDmg"
            paths: projects/app-game-control-line/build/packaging/dmg/*.dmg
          - name: macOS Intel x64 (dmg)
            os: macos-15-intel # an Intel runner; check the label against GitHub's list if the job never starts
            artifact: macos-x64
            environment: release
            tasks: ":app-game-control-line:packageDmg"
            paths: projects/app-game-control-line/build/packaging/dmg/*.dmg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm desktop-file-utils xvfb libgl1-mesa-dri libgl1 libasound2

      # jpackage 21 builds an .msi with WiX 3.x; the runner image may already ship a 3.14.1 build
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if command -v candle.exe >/dev/null 2>&1 || ls -d "/c/Program Files (x86)"/WiX*3*/bin/candle.exe >/dev/null 2>&1; then
            echo "WiX 3.x already installed"
            for d in "/c/Program Files (x86)"/WiX*3*/bin; do
              [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
            done
          else
            choco install wixtoolset --version=3.14.1 --no-progress -y
          fi

      # The Developer ID certificate lives only in a temporary keychain of this job. The packaging build signs with the
      # identity in ABYSSUS_MAC_SIGN_IDENTITY (the app, its native libraries, the jars' native libraries and the .dmg).
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "::error::Secrets MAC_CERT_P12 and MAC_CERT_PASSWORD are not set (Developer ID Application certificate, base64 .p12, and its password)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity in the certificate (a missing private key or another certificate type?)"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "ABYSSUS_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build installers
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} -PcontrolLineVersion=${{ needs.version.outputs.version }} --no-daemon

      # Apple scans the .dmg and everything in it; the ticket is stapled so the app opens offline too
      - name: Notarize macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Secrets APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are not set"
            exit 1
          fi
          dmgs=(projects/app-game-control-line/build/packaging/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected one .dmg, found: ${dmgs[*]}"; exit 1; }
          dmg="${dmgs[0]}"
          result="$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 40m --output-format json)"
          echo "$result"
          status="$(jq -r '.status' <<< "$result")"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r '.id' <<< "$result")" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Notarization of $dmg ended with status $status"
            exit 1
          fi
          # stapler talks to Apple's CloudKit, which drops connections now and then (NSURLErrorDomain -1005): retry
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt of 5), retrying"
              sleep $((attempt * 15))
            done
            return 1
          }
          retry xcrun stapler staple "$dmg"
          retry xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Smoke test Linux packages
        if: runner.os == 'Linux'
        run: scripts/smoke-control-line-linux.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: control-line-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

      # The update package: game jars with the natives of every desktop platform and the bundled project, no Java runtime
      - name: Build update package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'
          ./gradlew :app-game-control-line:distZip -Pabyssus.universalDist=true -PcontrolLineVersion="$version" --no-daemon
          mkdir -p build/update
          zips=(projects/app-game-control-line/build/distributions/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one distribution zip, found: ${zips[*]}"
            exit 1
          fi
          cp "${zips[0]}" "build/update/control-line-$version-update.zip"

      - name: Upload update package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: control-line-update
          path: build/update/*.zip
          if-no-files-found: error
          retention-days: 7

  # Only when every platform built: a failed platform publishes nothing
  publish:
    name: Sign and publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: control-line-*
          merge-multiple: true
          path: dist

      # Some artifacts keep a subfolder (appimage/, deb/, rpm/); the release takes a flat list of files
      - name: Flatten assets
        run: |
          mkdir release
          find dist -type f -exec mv -n {} release/ \;
          ls -l release

      # The private key comes only from the environment and is written nowhere but a 0600 temporary file
      - name: Sign checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        working-directory: release
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY is not set (Ed25519 private key, PEM)"
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS .
          openssl pkey -in "$key" -pubout -out update-key.pub.pem
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkeyutl -verify -pubin -inkey update-key.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mapfile -t assets < <(find release -type f | sort)
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "Control Line $VERSION" \
            --notes "Control Line $VERSION.

          - Installers with the launcher and their own Java runtime: .deb, .rpm and .AppImage (Linux x64), .msi (Windows x64), .dmg (macOS arm64 and Intel).
          - \`control-line-$VERSION-update.zip\`: the update package the installed launcher downloads.
          - \`SHA256SUMS\` with its Ed25519 signature \`SHA256SUMS.sig\` and the public key \`update-key.pub.pem\`: \`openssl pkeyutl -verify -pubin -inkey update-key.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig\`, then \`sha256sum --check SHA256SUMS\`.

          The macOS .dmg files are signed and notarized. The other installers are not code-signed, so Windows SmartScreen warns on first start; see the game's README."
