name: Release Control Line

# Runs only for a tag `cl-vX.Y.Z` and publishes the release `cl-vX.Y.Z` with:
# - the installers that carry the game's launcher and its own Java runtime: .deb, .rpm and .AppImage (Linux x64),
#   .msi (Windows x64), .dmg (macOS arm64 and Intel). jpackage cannot cross-build, so each is built on a runner of its OS;
# - the update package `control-line-X.Y.Z-update.zip`: the game's jars (natives of every desktop platform) and its
#   project, which an installed launcher downloads instead of a new installer;
# - `SHA256SUMS` over every asset and `SHA256SUMS.sig`, its Ed25519 signature made with the private update key, plus
#   `update-key.pub.pem`, the public half, so anyone can check the files with
#   `openssl pkeyutl -verify -pubin -inkey update-key.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig`.
#
# The private key is the secret UPDATE_SIGNING_KEY (PEM, `openssl genpkey -algorithm ED25519`), read only by the publish
# job in the `release` environment. Installers are not code-signed (Authenticode, Developer ID) yet.
on:
  push:
    tags: ['cl-v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The .msi needs a numeric version, the .dmg a major version above 0 (jpackage rejects 0.y.z on macOS), and the
      # launcher orders releases by it: only cl-vX.Y.Z with X >= 1 is accepted
      - name: Check tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^cl-v([1-9][0-9]*\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not cl-vX.Y.Z with a major version X of 1 or more (macOS packages reject 0.y.z)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (deb, rpm, AppImage)
            os: ubuntu-22.04 # the older glibc is the floor of the AppImage
            artifact: linux-x64
            tasks: ":app-game-control-line:packageDeb :app-game-control-line:packageRpm :app-game-control-line:packageAppImage"
            paths: |
              projects/app-game-control-line/build/packaging/deb/*.deb
              projects/app-game-control-line/build/packaging/rpm/*.rpm
              projects/app-game-control-line/build/packaging/appimage/*.AppImage
          - name: Windows x64 (msi)
            os: windows-latest
            artifact: windows-x64
            tasks: ":app-game-control-line:packageMsi"
            paths: projects/app-game-control-line/build/packaging/msi/*.msi
          - name: macOS arm64 (dmg)
            os: macos-latest # Apple silicon
            artifact: macos-arm64
            tasks: ":app-game-control-line:packageDmg"
            paths: projects/app-game-control-line/build/packaging/dmg/*.dmg
          - name: macOS Intel x64 (dmg)
            os: macos-15-intel # an Intel runner; check the label against GitHub's list if the job never starts
            artifact: macos-x64
            tasks: ":app-game-control-line:packageDmg"
            paths: projects/app-game-control-line/build/packaging/dmg/*.dmg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm desktop-file-utils xvfb libgl1-mesa-dri libgl1 libasound2

      # jpackage 21 builds an .msi with WiX 3.x; the runner image may already ship a 3.14.1 build
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if command -v candle.exe >/dev/null 2>&1 || ls -d "/c/Program Files (x86)"/WiX*3*/bin/candle.exe >/dev/null 2>&1; then
            echo "WiX 3.x already installed"
            for d in "/c/Program Files (x86)"/WiX*3*/bin; do
              [ -d "$d" ] && cygpath -w "$d" >> "$GITHUB_PATH"
            done
          else
            choco install wixtoolset --version=3.14.1 --no-progress -y
          fi

      - name: Build installers
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} -PcontrolLineVersion=${{ needs.version.outputs.version }} --no-daemon

      - name: Smoke test Linux packages
        if: runner.os == 'Linux'
        run: scripts/smoke-control-line-linux.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: control-line-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

      # The update package: game jars with the natives of every desktop platform and the bundled project, no Java runtime
      - name: Build update package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'
          ./gradlew :app-game-control-line:distZip -Pabyssus.universalDist=true -PcontrolLineVersion="$version" --no-daemon
          mkdir -p build/update
          zips=(projects/app-game-control-line/build/distributions/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one distribution zip, found: ${zips[*]}"
            exit 1
          fi
          cp "${zips[0]}" "build/update/control-line-$version-update.zip"

      - name: Upload update package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: control-line-update
          path: build/update/*.zip
          if-no-files-found: error
          retention-days: 7

  # Only when every platform built: a failed platform publishes nothing
  publish:
    name: Sign and publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: control-line-*
          merge-multiple: true
          path: dist

      # Some artifacts keep a subfolder (appimage/, deb/, rpm/); the release takes a flat list of files
      - name: Flatten assets
        run: |
          mkdir release
          find dist -type f -exec mv -n {} release/ \;
          ls -l release

      # The private key comes only from the environment and is written nowhere but a 0600 temporary file
      - name: Sign checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        working-directory: release
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY is not set (Ed25519 private key, PEM)"
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS .
          openssl pkey -in "$key" -pubout -out update-key.pub.pem
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkeyutl -verify -pubin -inkey update-key.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mapfile -t assets < <(find release -type f | sort)
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "Control Line $VERSION" \
            --notes "Control Line $VERSION.

          - Installers with the launcher and their own Java runtime: .deb, .rpm and .AppImage (Linux x64), .msi (Windows x64), .dmg (macOS arm64 and Intel).
          - \`control-line-$VERSION-update.zip\`: the update package the installed launcher downloads.
          - \`SHA256SUMS\` with its Ed25519 signature \`SHA256SUMS.sig\` and the public key \`update-key.pub.pem\`: \`openssl pkeyutl -verify -pubin -inkey update-key.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig\`, then \`sha256sum --check SHA256SUMS\`.

          The installers are not code-signed, so Windows SmartScreen and macOS Gatekeeper warn on first start; see the game's README."
