# UI tests: the Abyssus plugin driven through Remote Robot in the canonical Linux environment (docker/ui-tests: Ubuntu 24.04,
# Xvfb, amd64). Pixel baselines are compared in read-only mode; updating them never happens here (CI=true refuses it).
#
# Runs on manual dispatch and on pull requests, independently of the headless 'check' in build.yml.
# See docs/ai/testing.md ("UI tests", "UI screenshot baselines") for what is covered and how to reproduce a run locally.

name: Run UI Tests
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI tests (canonical Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      # The canonical image carries JDK 21 for Gradle and the virtual display; the wrapper runs inside it.
      - name: Run UI tests
        env:
          ABYSSUS_UI_PLATFORM: linux/amd64
          ABYSSUS_UI_STARTUP_TIMEOUT: "600"
        run: scripts/run-ui-tests-docker.sh

      # Screenshots, hierarchy dumps, expected/actual/diff images, IDE logs and the JUnit report of every run.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics
          path: projects/plugin-abyssus/build/reports/ui-tests/
          if-no-files-found: warn
          retention-days: 14

      # A failed run must not leave the sandbox IDE or its container behind on a reused runner.
      - name: Clean up
        if: always()
        run: docker ps -q | xargs -r docker stop
