name: Build Control Line distributions

# Native packages (deb, rpm, AppImage, msi, dmg) each need a runner of their own OS and architecture, because jpackage cannot
# cross-build; the universal zip is built beside them. Packages are unsigned: the signed release is release-control-line.yml. Pull requests build everything
# and publish nothing; only a successful build of every platform on main replaces the canary release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A running main build may be mid-release; only superseded pull request builds are cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The packages and their smoke tests: the shared steps of _package-control-line.yml, unsigned and without any secret
  build:
    name: Build
    uses: ./.github/workflows/_package-control-line.yml
    with:
      release: false
      # The package version must be numeric (.msi) and a newer canary must upgrade an installed one: 1.0.<run number>
      version: 1.0.${{ github.run_number }}

  # The universal archive (Windows, macOS and Linux with a system Java) is built beside the Linux packages
  universal:
    name: Build universal distribution
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # One archive for Windows, macOS and Linux with a system Java: natives of every platform, the macOS launch flag chosen at start
      - name: Build universal distribution
        run: ./gradlew :app-game-control-line:distZip -Pabyssus.universalDist=true --no-daemon

      - name: Upload universal distribution
        uses: actions/upload-artifact@v4
        with:
          name: control-line-universal
          path: projects/app-game-control-line/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

  # Only when every platform built: a failed platform leaves the previous canary in place
  publish:
    name: Publish canary release
    needs: [build, universal]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: control-line-*
          merge-multiple: true
          path: dist

      # Rolling pre-release: the previous canary and its tag are replaced by the build of this commit
      - name: Publish canary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          ls -lR dist
          # Some artifacts keep a subfolder (appimage/, deb/, rpm/); gh needs files, not directories
          mapfile -t assets < <(find dist -type f | sort)
          gh release delete canary --cleanup-tag --yes || true
          gh release create canary "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Control Line canary ($short_sha)" \
            --notes "Automated build of \`main\` at $GITHUB_SHA: .deb, .rpm and .AppImage (Linux x64), .msi (Windows x64), .dmg (macOS arm64 and Intel), each with its own Java runtime, and a universal .zip that needs Java. The packages are not signed, so Windows SmartScreen and macOS Gatekeeper warn on first start; see the game's README. May be unstable." \
            --prerelease
