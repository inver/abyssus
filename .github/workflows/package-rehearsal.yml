# Builds and inspects the unsigned plugin zip on Java 21. No publish credentials, no release trigger.
name: Package Rehearsal
on:
  workflow_dispatch:
  pull_request:

jobs:
  rehearse:
    name: Build and inspect the plugin zip
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Compiles the Vulkan compute shaders to SPIR-V (raytracing module)
      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Rehearse packaging
        run: scripts/rehearse-package.sh
